name: Build KPatch | OnePlus Pad 2 Pro (SukiSU)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelPatch source
        uses: actions/checkout@v4
        with:
          path: kpatch

      - name: Checkout config & kallsyms
        uses: actions/checkout@v4
        with:
          path: my_kernel

      - name: Download AOSP android15-6.6 Clang
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang --depth=1 --single-branch --branch android15-6.6
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Prepare kernel env and generate Module.symvers
        run: |
          mkdir -p kernel/out
          cp my_kernel/defconfig kernel/out/.config
          python3 -c '
import re
with open("my_kernel/kallsyms.txt","r",encoding="utf-8") as f, open("kernel/Module.symvers","w",encoding="utf-8") as out:
    for line in f:
        m = re.match(r"([0-9a-f]+) (\w+) (\S+)", line.strip())
        if m:
            addr, typ, name = m.groups()
            out.write(f"{addr} {name}\n")
          '
          cd kernel/out
          make -C ../ O=$PWD ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make -C ../ O=$PWD ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Build KernelPatch LKM
        run: |
          cd kpatch/lkm
          make KERNEL=../kernel/out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pad2Pro-KernelPatch
          path: kpatch/lkm/*.ko
