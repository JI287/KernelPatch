name: Build KernelPatch LKMs (matrix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: '选择目标KMI版本'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi: [ ${{ inputs.kmi }} ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -y make clang llvm binutils

      - name: Build KPMS module
        run: |
          export KMI=${{ matrix.kmi }}
          export DDK_RELEASE=20260313
          make -C kpms KMI=${KMI}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpms-module-${{ matrix.kmi }}
          path: kpms/*.ko
