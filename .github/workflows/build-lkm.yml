name: Build KernelPatch LKMs (matrix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: '选择目标KMI版本'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KMI: ${{ github.event.inputs.kmi }}
      DDK_RELEASE: 20260313
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build KPMS
        run: |
          make KMI=${KMI}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpms-module-${{ env.KMI }}
          path: lkm/*.ko
