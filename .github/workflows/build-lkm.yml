name: Build KernelPatch LKMs (matrix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: '选择目标KMI版本'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KMI: ${{ github.event.inputs.kmi }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libelf-dev bc bison flex libssl-dev

      - name: Debug ls root & tools
        run: |
          echo "==== Root files ===="
          ls -la
          echo "==== tools folder ===="
          ls -la tools/
