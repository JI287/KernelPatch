name: Build KPMS Cross Compile

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: Android GKI KMI
        required: true
        default: android15-6.6
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KMI: ${{ github.event.inputs.kmi }}
      ARCH: aarch64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cross compile dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libelf-dev bc flex bison
          sudo apt install -y aarch64-linux-gnu-gcc aarch64-linux-gnu-g++

      - name: Download GKI kernel headers
        run: |
          mkdir -p kernel
          cd kernel
          # 拉取对应KMI的GKI开发包（google gki）
          curl -L -O https://dl.google.com/android/gki/kernel_${{ env.KMI }}.tar.gz
          tar -xf kernel_${{ env.KMI }}.tar.gz
          cd ..

      - name: Build kpms module
        run: |
          mkdir build && cd build
          cmake ../kpms -DKMI=${{ env.KMI }} -DKERNEL_ROOT=${PWD}/../kernel/kernel_${{ env.KMI }}
          make -j$(nproc)

      - name: Upload compiled ko
        uses: actions/upload-artifact@v4
        with:
          name: kpms-${{ env.KMI }}
          path: build/*.ko
