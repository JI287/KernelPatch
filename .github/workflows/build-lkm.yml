name: Build KPMS Kbuild
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: Android GKI KMI
        required: true
        default: android15-6.6
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KMI: ${{ github.event.inputs.kmi }}
      ARCH: aarch64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_DIR: kernel/${{ github.event.inputs.kmi }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain & build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libelf-dev
          sudo apt install -y aarch64-linux-gnu-gcc aarch64-linux-gnu-g++

      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-${{ env.KMI }}

      - name: Download GKI kernel source (if cache miss)
        run: |
          mkdir -p kernel
          if [ ! -d "${{ env.KERNEL_DIR }}/.git" ]; then
            git clone --depth=1 -b common-${{ env.KMI }} https://android.googlesource.com/kernel/common ${{ env.KERNEL_DIR }}
          fi
          cd ${{ env.KERNEL_DIR }}
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} defconfig
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} prepare
          cd ../../

      - name: Build out-of-tree kpms module
        run: |
          cd kpms
          make -C ../${{ env.KERNEL_DIR }} M=${PWD} ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} modules

      - name: Upload ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpms-${{ env.KMI }}
          path: kpms/*.ko
