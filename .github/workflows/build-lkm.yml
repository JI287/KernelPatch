name: Build KPMS Kbuild
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: Android GKI KMI
        required: true
        default: android15-6.6
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KMI: ${{ github.event.inputs.kmi }}
      ARCH: aarch64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain & build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libelf-dev
          sudo apt install -y aarch64-linux-gnu-gcc aarch64-linux-gnu-git

      - name: Download GKI kernel source
        run: |
          mkdir -p kernel
          cd kernel
          git clone --depth=1 -b common-${{ env.KMI }} https://android.googlesource.com/kernel/common ${{ env.KMI }}
          cd ${{ env.KMI }}
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} defconfig
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} prepare
          cd ../../

      - name: Build out-of-tree kpms module
        run: |
          cd kpms
          make -C ../kernel/${{ env.KMI }} M=${PWD} ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} modules

      - name: Upload ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpms-${{ env.KMI }}
          path: kpms/*.ko
