name: Build KPMS LKM
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: Android GKI KMI
        required: true
        default: android15-6.6
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Resolve KMI version
        id: resolve_kmi
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "KMI=${{ github.event.inputs.kmi }}" >> $GITHUB_ENV
          else
            echo "KMI=android15-6.6" >> $GITHUB_ENV
          fi
          echo "KERNEL_DIR=kernel/${{ env.KMI }}" >> $GITHUB_ENV

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain & build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libelf-dev
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-${{ env.KMI }}

      - name: Download & prepare GKI kernel
        run: |
          mkdir -p kernel
          echo "Target kernel: ${{ env.KMI }}"
          echo "Kernel path: ${{ env.KERNEL_DIR }}"
          if [ ! -d "${{ env.KERNEL_DIR }}/.git" ]; then
            echo "Cloning kernel repo..."
            git clone --depth=1 -b ${{ env.KMI }} https://android.googlesource.com/kernel/common ${{ env.KERNEL_DIR }}
          fi
          cd ${{ env.KERNEL_DIR }}
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} gki_defconfig
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} prepare
          make ARCH=${{ env.ARCH }} CROSS_COMPILE=${{ env.CROSS_COMPILE }} modules_prepare
          cd ../../

      - name: Build out-of-tree kpms module
        run: |
          cd kpms
          make -C ../${{ env.KERNEL_DIR }} M=${PWD} \
            ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            MODPOST=0 \
            modules

      - name: Upload ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpms-${{ env.KMI }}
          path: kpms/*.ko
