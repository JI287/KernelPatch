name: Build KPMS LKM
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: Android GKI KMI
        required: true
        default: android15-6.6
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build GKI out-of-tree module
        uses: feicong/android-kernel-build-action@v2
        with:
          kernel_version: ${{ github.event.inputs.kmi || 'android15-6.6' }}
          module_dir: kpms

      - name: Upload ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpms-${{ github.event.inputs.kmi || 'android15-6.6' }}
          path: kpms/*.ko
