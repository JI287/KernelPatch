name: Build KernelPatch LKMs

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      kmi:
        description: '选择KMI版本'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6
          - android14-5.15
          - android13-5.10
          - android12-5.4

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KMI: ${{ github.event.inputs.kmi }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compile dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libelf-dev bc bison flex libssl-dev

      - name: Check files before build
        run: |
          ls -la
          echo "==== Check kernel headers folder ===="
          ls -la kernel/ || echo "kernel文件夹不存在"

      - name: Build full KernelPatch
        run: |
          make KMI=${KMI}

      - name: Upload compiled ko artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kpms-modules-${{ env.KMI }}
          path: lkm/*.ko
